name: iOS simulator smoke build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios-app/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.webmanifest'
      - '.github/workflows/ios-smoke.yml'
jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor dependencies
        working-directory: ios-app
        run: npm install --no-audit --no-fund
      - name: Generate unsigned iOS Xcode project
        working-directory: ios-app
        run: npm run ios:init
      - name: Verify bundled app assets
        working-directory: ios-app
        run: |
          test -s www/index.html
          test -s www/app-auth.js
          test -s www/app.js
          test -s www/native-push.js
          test -s www/runtime-diagnostics.js
          grep -q 'src="runtime-diagnostics.js"' www/index.html
          grep -q 'src="native-push.js"' www/index.html
          ! grep -q '/pop-and-go/' www/index.html
      - name: Compile iOS Simulator app without signing
        working-directory: ios-app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -derivedDataPath build -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive unsigned simulator application
        working-directory: ios-app
        run: |
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app ios-simulator-app.zip
      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: raus-und-guggen-ios-simulator
          path: ios-app/ios-simulator-app.zip
          retention-days: 7
