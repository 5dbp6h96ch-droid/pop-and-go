name: Deploy Pop & Go to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate update files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s update-check.js
          test -s version.json
          node --check update-check.js
          node -e "const v=require('./version.json');if(!v.version)process.exit(1)"
          grep -q 'src="update-check.js?v=20261026-update-v1"' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
