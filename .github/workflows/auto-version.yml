name: Build and publish raus & guggen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version into published files
        env:
          BUILD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          build=os.environ["BUILD"]
          page=pathlib.Path("index.html")
          html=page.read_text(encoding="utf-8")
          meta=r'<meta name="app-build" content="[^"]*">'
          if not re.search(meta,html):
              raise SystemExit("Missing app-build meta tag")
          page.write_text(re.sub(meta,f'<meta name="app-build" content="{build}">',html,count=1),encoding="utf-8")
          pathlib.Path("version.json").write_text(json.dumps({"version":build},indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
