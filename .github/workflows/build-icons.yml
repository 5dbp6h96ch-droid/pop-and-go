name: Prepare app icons
on:
  push:
    paths:
      - ".github/workflows/build-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare resized PNG icons
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("app-icon-original.jpg").convert("RGB")
          for size,path in ((180,"apple-touch-icon.png"),(192,"icon-192.png"),(512,"icon-512.png")):
              im.resize((size,size),Image.Resampling.LANCZOS).save(path,optimize=True)
          PY
      - name: Publish icon files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Add iPhone and Android home-screen PNG icons [skip ci]"
            git push
          fi
