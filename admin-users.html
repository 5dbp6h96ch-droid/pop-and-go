<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benutzerverwaltung</title><style>body{font:16px system-ui;background:#faf9f6;color:#24163c;margin:0}main{max-width:740px;margin:auto;padding:20px}.back-link{display:inline-flex;align-items:center;min-height:44px;margin-bottom:12px;color:#502f86;font-weight:650;text-decoration:none}.back-link:focus-visible{outline:3px solid #7135f4;outline-offset:4px;border-radius:4px}h1{background:#7135f4;color:white;padding:22px;border-radius:18px}input,select,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #dcd4e8;box-sizing:border-box}input,select{width:100%;margin:6px 0}button{background:#7135f4;color:white;border:0;margin:5px 7px 3px 0}.user-card{background:white;border:1px solid #e8e1ee;border-radius:16px;padding:16px;margin:10px 0;overflow-wrap:anywhere}.user-card p{margin:7px 0}.user-meta{display:flex;flex-direction:column;gap:6px;margin-top:12px;line-height:1.45}.user-meta small{display:block;font-size:.85em}.user-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.user-actions button{margin:0;min-height:44px;max-width:100%;cursor:pointer}.user-actions button:disabled{opacity:.6;cursor:wait}@media(max-width:480px){.user-actions button{width:100%}}[hidden]{display:none!important}</style><main><a class="back-link" href="index.html#verwaltung" aria-label="Zurück zur privaten Verwaltung">← Zurück zur Verwaltung</a><h1>Benutzerverwaltung</h1><p id="status">Zugriff wird geprüft</p><div id="app" hidden><input id="search" placeholder="Name oder E-Mail"><select id="filter"><option value="">Alle</option><option>active</option><option>pending</option><option>suspended</option><option>rejected</option></select><p id="summary"></p><div id="users"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script><script src="admin-users.js"></script>
