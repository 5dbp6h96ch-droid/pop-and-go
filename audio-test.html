<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>raus & guggen – Audiotest</title><style>body{font:16px system-ui;max-width:600px;margin:auto;padding:22px;background:#faf9f4;color:#24163c}button,a{display:block;padding:16px;margin:14px 0;border:0;border-radius:14px;background:#7135f4;color:white;font:inherit;text-align:center}button:disabled{opacity:.5}audio{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Audioaufnahme – iPhone-Test</h1><p>Diese isolierte Testseite prüft nur die kostenlose Aufnahme mit MediaRecorder, ohne Web Speech API und ohne Upload. Es wird noch kein Text erzeugt.</p><button id="toggle">Aufnahme starten</button><p id="status" role="status">Bereit</p><audio id="playback" controls hidden></audio><pre id="log"></pre><a href="./">Zurück zur App</a><script>
(()=>{"use strict";const btn=document.getElementById("toggle"),status=document.getElementById("status"),audio=document.getElementById("playback"),log=document.getElementById("log");let recorder=null,stream=null,chunks=[],url=null;
function note(x){log.textContent+=new Date().toLocaleTimeString("de-DE")+" – "+x+"\n"}
function cleanup(){if(stream)for(const track of stream.getTracks())track.stop();stream=null;recorder=null;btn.disabled=false;btn.textContent="Aufnahme starten"}
btn.onclick=async()=>{if(recorder&&recorder.state==="recording"){btn.disabled=true;status.textContent="Aufnahme wird abgeschlossen …";recorder.stop();return}try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error("MediaRecorder oder Mikrofonzugriff nicht unterstützt");stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=e=>{note("Fehler: "+(e.error?.name||"unbekannt"));status.textContent="Aufnahmefehler";cleanup()};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||"audio/mp4"});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);audio.src=url;audio.hidden=false;status.textContent="Aufnahme vorhanden ("+Math.round(blob.size/1024)+" KB). Mit Play prüfen.";note("Aufnahme beendet, Bytes: "+blob.size);cleanup()};recorder.start(250);btn.textContent="Aufnahme beenden";status.textContent="Mikrofon nimmt auf …";note("Aufnahme gestartet")}catch(e){note("Startfehler: "+e.name);status.textContent="Mikrofon konnte nicht gestartet werden.";cleanup()}};
window.addEventListener("pagehide",()=>{if(url)URL.revokeObjectURL(url);if(stream)stream.getTracks().forEach(t=>t.stop())});
})();</script></body></html>
